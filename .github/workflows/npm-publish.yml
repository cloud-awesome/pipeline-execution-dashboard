name: npm publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full release flow without publishing to npm.
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        id: version
        shell: bash
        run: |
          YEAR="$(date -u +'%Y')"
          MONTH="$(date -u +'%-m')"
          DAY="$(date -u +'%-d')"
          TIME_OF_DAY="$(date -u +'%H%M%S')"
          PATCH="$((DAY * 1000000 + 10#$TIME_OF_DAY))"
          PACKAGE_VERSION="${YEAR}.${MONTH}.${PATCH}"
          DISPLAY_VERSION="$(date -u +'%Y.%m.%d.%H%M%S')"

          npm version "$PACKAGE_VERSION" --no-git-tag-version --allow-same-version

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing package version $PACKAGE_VERSION generated from $DISPLAY_VERSION UTC."

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release summary
        run: |
          {
            echo "### npm package release"
            echo ""
            echo "- Package version: \`${{ steps.version.outputs.package_version }}\`"
            echo "- Display CalVer: \`${{ steps.version.outputs.display_version }}\` UTC"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
